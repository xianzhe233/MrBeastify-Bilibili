<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            box-sizing: border-box;
            font-size: 15px;
            font-family: Arial, sans-serif;
            width: 300px;
            margin: 0;
            padding: 16px;
            color: #111;
            background-color: #08B0D5;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 22px;
            line-height: 1.2;
        }

        label {
            display: block;
            margin: 0 0 14px;
        }

        input[type="number"] {
            box-sizing: border-box;
            width: 100%;
            margin-top: 6px;
            padding: 7px 8px;
            border: 1px solid #006E87;
            border-radius: 4px;
            font-size: 15px;
        }

        .fancy-checkbox {
            position: relative;
            min-height: 22px;
            padding-left: 30px;
            cursor: pointer;
        }

        .hidden-checkbox {
            position: absolute;
            opacity: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: #fff;
            border: 1px solid #006E87;
            border-radius: 3px;
        }

        .checkbox-text {
            line-height: 22px;
        }

        .hidden-checkbox:checked+.checkmark:after {
            content: "";
            position: absolute;
            display: block;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 12px;
            border: solid #333;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>

<body>
    <div class="popup-container">
        <h1 id="extension-title">Bilibili MrBeastify</h1>

        <label class="fancy-checkbox">
            <input type="checkbox" id="disableExtension" class="hidden-checkbox">
            <span class="checkmark"></span>
            <span class="checkbox-text">Extension Enabled</span>
        </label>

        <label>
            Appear Chance (%)
            <input type="number" id="appearChance" min="0" max="100" step="5">
        </label>

        <label>
            Flip Chance (%)
            <input type="number" id="flipChance" min="0" max="100" step="5">
        </label>
    </div>

    <script src="settings.js"></script>
</body>

</html>
